<script type="module">
import * as THREE from 'three';

// ===================================================================
// SECTION 01: SETTINGS
// ===================================================================
const settings = { turn: 'snap', voice: true, height: 'auto' };
try { Object.assign(settings, JSON.parse(localStorage.getItem('ww_settings') || '{}')); } catch (e) {}
const $ = id => document.getElementById(id);
$('turnSel').value = settings.turn;
$('voiceChk').checked = settings.voice;
$('heightSel').value = settings.height;
function saveSettings() {
  settings.turn = $('turnSel').value; settings.voice = $('voiceChk').checked; settings.height = $('heightSel').value;
  try { localStorage.setItem('ww_settings', JSON.stringify(settings)); } catch (e) {}
}

// ===================================================================
// SECTION 02: RENDERER, SCENE, CAMERA RIG
// ===================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
try { renderer.xr.setFoveation(1); } catch (e) {}
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const BG = new THREE.Color(0x1b1d24);
scene.background = BG;
scene.fog = new THREE.Fog(0x1b1d24, 35, 90);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.03, 200);
camera.rotation.order = 'YXZ';
const rig = new THREE.Group();
scene.add(rig);
rig.add(camera);
camera.position.set(0, 1.62, 0);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const V3 = THREE.Vector3;
const tmpA = new V3(), tmpB = new V3(), tmpC = new V3(), tmpD = new V3();
const UP = new V3(0, 1, 0);
const wrapAng = a => Math.atan2(Math.sin(a), Math.cos(a));
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let T = 0; // game time (seconds)

// ===================================================================
// SECTION 03: HELPERS (materials, boxes, text, colliders)
// ===================================================================
const matCache = {};
function M(color, extra) {
  const k = color + '|' + JSON.stringify(extra || {});
  if (!matCache[k]) matCache[k] = new THREE.MeshLambertMaterial(Object.assign({ color }, extra || {}));
  return matCache[k];
}
function addBox(w, h, d, color, x, y, z, parent = scene, extra) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(color, extra));
  m.position.set(x, y, z); parent.add(m); return m;
}
function addCyl(rt, rb, h, color, x, y, z, parent = scene, seg = 16, extra) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), M(color, extra));
  m.position.set(x, y, z); parent.add(m); return m;
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return { canvas: c, ctx: g, tex: t };
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function drawCenteredLines(g, pw, ph, text, opts) {
  const lines = text.split('\n');
  let fs = opts.fs || Math.min(ph / (lines.length + 0.7), 130);
  g.font = `bold ${fs}px system-ui, Arial`;
  for (const l of lines) { const w = g.measureText(l).width; if (w > pw * 0.9) fs = Math.min(fs, fs * pw * 0.9 / w); }
  g.font = `bold ${fs}px system-ui, Arial`;
  g.fillStyle = opts.fg || '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  lines.forEach((l, i) => g.fillText(l, pw / 2, ph / 2 + (i - (lines.length - 1) / 2) * fs * 1.18));
}
function signTexture(text, w, h, opts = {}) {
  const pw = 1024, ph = Math.max(64, Math.round(1024 * h / w));
  return canvasTex(pw, ph, g => {
    g.fillStyle = opts.bg || '#0d1a4a'; g.fillRect(0, 0, pw, ph);
    if (opts.stripe) { g.fillStyle = opts.stripe; g.fillRect(0, ph - ph * 0.12, pw, ph * 0.12); }
    if (opts.border) { g.strokeStyle = opts.border; g.lineWidth = 14; g.strokeRect(7, 7, pw - 14, ph - 14); }
    drawCenteredLines(g, pw, ph, text, opts);
  }).tex;
}
function sign(text, w, h, x, y, z, ry = 0, opts = {}) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: signTexture(text, w, h, opts) }));
  m.position.set(x, y, z); m.rotation.y = ry; scene.add(m); return m;
}

// --- Colliders (simple boxes on the floor plan) ---
const colliders = [];
function addCol(x1, z1, x2, z2) {
  const c = { x1: Math.min(x1, x2), x2: Math.max(x1, x2), z1: Math.min(z1, z2), z2: Math.max(z1, z2), on: true };
  colliders.push(c); return c;
}
function collide(p, r) {
  for (let it = 0; it < 2; it++) for (const c of colliders) {
    if (!c.on) continue;
    const cx = clamp(p.x, c.x1, c.x2), cz = clamp(p.z, c.z1, c.z2);
    const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
    if (d2 < r * r) {
      if (d2 > 1e-8) { const d = Math.sqrt(d2); p.x = cx + dx / d * r; p.z = cz + dz / d * r; }
      else {
        const l = p.x - c.x1, rr = c.x2 - p.x, t = p.z - c.z1, b = c.z2 - p.z, mn = Math.min(l, rr, t, b);
        if (mn === l) p.x = c.x1 - r; else if (mn === rr) p.x = c.x2 + r; else if (mn === t) p.z = c.z1 - r; else p.z = c.z2 + r;
      }
    }
  }
  return p;
}

// ===================================================================
// SECTION 04: AUDIO (all sounds generated in code)
// ===================================================================
let AC = null, master = null, alarmOsc = null, heartTimer = 0, heartLeft = 0;
function initAudio() {
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.7; master.connect(AC.destination);
    // museum crowd murmur
    const buf = AC.createBuffer(1, AC.sampleRate * 3, AC.sampleRate);
    const d = buf.getChannelData(0); let last = 0;
    for (let i = 0; i < d.length; i++) { last = last * 0.97 + (Math.random() * 2 - 1) * 0.03; d[i] = last; }
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 420; f.Q.value = 0.6;
    const g = AC.createGain(); g.gain.value = 0.5;
    src.connect(f); f.connect(g); g.connect(master); src.start();
  } catch (e) { AC = null; }
}
function tone(freq, dur, type = 'sine', vol = 0.2, slideTo = null, delay = 0) {
  if (!AC) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(dur, vol = 0.2, freq = 2000, type = 'lowpass', delay = 0) {
  if (!AC) return;
  const t0 = AC.currentTime + delay;
  const buf = AC.createBuffer(1, Math.max(1, AC.sampleRate * dur), AC.sampleRate);
  const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(); s.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0);
}
const SFX = {
  click() { tone(900, 0.06, 'square', 0.12); },
  grab() { tone(320, 0.08, 'triangle', 0.15, 520); },
  button() { tone(220, 0.12, 'square', 0.15); tone(660, 0.25, 'sine', 0.15, 990, 0.1); },
  robot() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.16, 'square', 0.08, null, i * 0.13)); },
  zap() { noise(0.12, 0.18, 4000, 'highpass'); tone(80, 0.15, 'sawtooth', 0.08); },
  hiss() { noise(1.4, 0.25, 3000, 'highpass'); },
  thump() { tone(70, 0.18, 'sine', 0.6, 40); },
  sting() { tone(1400, 0.08, 'square', 0.2); noise(0.25, 0.4, 1500, 'bandpass'); tone(110, 0.9, 'sawtooth', 0.15, 50); },
  phone() { [0, 0.25].forEach(d => tone(1200, 0.12, 'square', 0.06, null, d)); },
  whoosh() { noise(0.4, 0.25, 900, 'bandpass'); },
  chime() { [784, 988, 1175].forEach((f, i) => tone(f, 0.5, 'sine', 0.12, null, i * 0.12)); },
};
function startAlarm(sec) {
  if (!AC) return;
  for (let i = 0; i < sec * 2; i++) tone(i % 2 ? 620 : 840, 0.45, 'square', 0.07, null, i * 0.5);
}
function startHeartbeat(sec) { heartLeft = sec; heartTimer = 0; }
function updateHeartbeat(dt) {
  if (heartLeft <= 0) return;
  heartLeft -= dt; heartTimer -= dt;
  if (heartTimer <= 0) { SFX.thump(); setTimeout(() => SFX.thump(), 220); heartTimer = 0.85; buzzBoth(0.4, 60); }
}

// ===================================================================
// SECTION 05: VOICES & SUBTITLES
// ===================================================================
const hasTTS = 'speechSynthesis' in window;
let voices = [];
function loadVoices() { if (hasTTS) voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)); }
if (hasTTS) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
const VOICE = {
  KENNEDY: { pitch: 1.05, rate: 1.08, idx: 0, color: '#ff5566' },
  FLOYD: { pitch: 1.3, rate: 1.12, idx: 1, color: '#7dff9a' },
  'DR. HALE': { pitch: 0.72, rate: 0.95, idx: 2, color: '#7fe8ff' },
  'MUSEUM P.A.': { pitch: 1.0, rate: 1.0, idx: 3, color: '#ffd23f' },
  KID: { pitch: 1.8, rate: 1.15, idx: 4, color: '#ffd23f' },
  THUG: { pitch: 0.6, rate: 1.0, idx: 5, color: '#ff8a3d' },
  WOMAN: { pitch: 1.3, rate: 1.1, idx: 6, color: '#ff9ad6' },
  OFFICER: { pitch: 0.75, rate: 1.05, idx: 7, color: '#6fa8ff' },
  VOICE: { pitch: 1.4, rate: 1.2, idx: 6, color: '#ffffff' },
};
function speak(who, text) {
  return new Promise(res => {
    if (!settings.voice || !hasTTS) return res(false);
    try {
      const u = new SpeechSynthesisUtterance(text.replace(/\.\.\./g, ', '));
      const v = VOICE[who] || {};
      u.pitch = v.pitch || 1; u.rate = v.rate || 1;
      if (voices.length) u.voice = voices[(v.idx || 0) % voices.length];
      u.onend = () => res(true); u.onerror = () => res(false);
      speechSynthesis.speak(u);
    } catch (e) { res(false); }
  });
}

// --- HUD panel that floats in front of your eyes (objective + subtitles) ---
const hud = canvasTex(1024, 420, () => {});
const hudMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.41),
  new THREE.MeshBasicMaterial({ map: hud.tex, transparent: true, depthTest: false, depthWrite: false }));
hudMesh.renderOrder = 1001; hudMesh.position.set(0, -0.3, -1.05); camera.add(hudMesh);
let hudObjective = '', hudSpeaker = '', hudText = '';
function wrapLines(g, text, maxW) {
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
function drawHUD() {
  const g = hud.ctx; g.clearRect(0, 0, 1024, 420);
  if (hudObjective) {
    let fs = 34; const label = '▶  ' + hudObjective;
    g.font = `bold ${fs}px system-ui,Arial`;
    while (g.measureText(label).width > 960 && fs > 18) { fs -= 2; g.font = `bold ${fs}px system-ui,Arial`; }
    const w = g.measureText(label).width + 44;
    g.fillStyle = 'rgba(0,0,0,0.62)'; roundRect(g, (1024 - w) / 2, 6, w, 58, 14); g.fill();
    g.fillStyle = '#ffd23f'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(label, 512, 36);
  }
  if (hudText) {
    g.font = '34px system-ui,Arial';
    const lines = wrapLines(g, hudText, 900);
    const h = 62 + lines.length * 42, y0 = 420 - h - 6;
    g.fillStyle = 'rgba(0,0,0,0.72)'; roundRect(g, 30, y0, 964, h, 18); g.fill();
    g.textAlign = 'left'; g.textBaseline = 'top';
    g.font = 'bold 30px system-ui,Arial'; g.fillStyle = (VOICE[hudSpeaker] || {}).color || '#fff';
    g.fillText(hudSpeaker, 60, y0 + 12);
    g.font = '34px system-ui,Arial'; g.fillStyle = '#fff';
    lines.forEach((l, i) => g.fillText(l, 60, y0 + 52 + i * 42));
  }
  if (typeof combat !== 'undefined' && combat.active) {
    g.fillStyle = 'rgba(0,0,0,0.6)'; roundRect(g, 312, 72, 400, 30, 10); g.fill();
    const k = clamp(hero.hp / 100, 0, 1); g.fillStyle = k > 0.4 ? '#3fdc6a' : '#ff3344'; roundRect(g, 318, 78, 388 * k, 18, 7); g.fill();
    g.fillStyle = '#fff'; g.font = 'bold 18px system-ui,Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('HEALTH', 512, 87);
  }
  hud.tex.needsUpdate = true;
}
function setObjective(t) { hudObjective = t || ''; drawHUD(); if (t) SFX.click(); }

let talkingNPC = null;
async function say(who, text, npc = null) {
  hudSpeaker = who; hudText = text; drawHUD();
  if (npc) { npc.talking = true; talkingNPC = npc; }
  const est = 1.1 + text.split(' ').length * 0.33;
  const p = (settings.voice && hasTTS) ? speak(who, text).then(ok => ok ? wait(0.25) : wait(est)) : wait(est);
  await Promise.race([p, wait(est * 2.4 + 2)]);
  if (npc) npc.talking = false;
  hudText = ''; drawHUD();
}

// --- Cards (chapter title / end screen) and fades ---
const fadeMesh = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 12),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 1, side: THREE.BackSide, depthTest: false, depthWrite: false }));
fadeMesh.renderOrder = 1000; camera.add(fadeMesh);
const tintMesh = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 12),
  new THREE.MeshBasicMaterial({ color: 0xaa0000, transparent: true, opacity: 0, side: THREE.BackSide, depthTest: false, depthWrite: false }));
tintMesh.renderOrder = 999; camera.add(tintMesh);
let cardMesh = null;
function showCard(lines, colors) {
  hideCard();
  const tex = canvasTex(1024, 560, g => {
    g.clearRect(0, 0, 1024, 560);
    const n = lines.length;
    lines.forEach((l, i) => {
      const fs = i === 0 ? 70 : (i === 1 ? 96 : 40);
      g.font = `bold ${fs}px system-ui,Arial`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = (colors && colors[i]) || (i === 1 ? '#e8182c' : '#ffffff');
      const y = 560 / 2 + (i - (n - 1) / 2) * 105;
      g.fillText(l, 512, y);
    });
  }).tex;
  cardMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 0.71),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false, opacity: 1 }));
  cardMesh.renderOrder = 1002; cardMesh.position.set(0, 0.08, -1.4); camera.add(cardMesh);
}
function hideCard() { if (cardMesh) { camera.remove(cardMesh); cardMesh = null; } }
function fadeTo(target, sec) {
  const start = fadeMesh.material.opacity, t0 = T;
  return waitFor(() => {
    const k = clamp((T - t0) / Math.max(0.01, sec), 0, 1);
    fadeMesh.material.opacity = lerp(start, target, k);
    fadeMesh.visible = fadeMesh.material.opacity > 0.001;
    return k >= 1;
  });
}

// ===================================================================
// SECTION 05b: STORY TIMING (wait / waitFor)
// ===================================================================
const waiters = [];
function waitFor(fn) { return new Promise(r => waiters.push({ fn, r })); }
function wait(sec) { const t = T + sec; return waitFor(() => T >= t); }
function checkWaiters() {
  for (let i = waiters.length - 1; i >= 0; i--) {
    let ok = false; try { ok = waiters[i].fn(); } catch (e) { ok = false; }
    if (ok) { const w = waiters.splice(i, 1)[0]; w.r(); }
  }
}

// ===================================================================
// SECTION 06: THE MUSEUM (built from code)
// ===================================================================
// Floor plan (meters):  Lobby x -10..10, z 0..12  |  Exhibit Hall x -10..10, z -20..0
// GenTech wing x 10..18, z -16..-6 (door at x=10, z -12..-9) | Snack bar x -16..-10, z -7..-1
scene.add(new THREE.HemisphereLight(0xfff4e6, 0x6a5a4a, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(6, 12, 8); scene.add(sun);

// Floors
const floorTex = canvasTex(256, 256, g => {
  g.fillStyle = '#c9bfae'; g.fillRect(0, 0, 256, 256);
  g.fillStyle = '#bdb2a0'; g.fillRect(0, 0, 128, 128); g.fillRect(128, 128, 128, 128);
  g.strokeStyle = '#a99d89'; g.lineWidth = 3; g.strokeRect(0, 0, 256, 256); g.strokeRect(0, 0, 128, 128); g.strokeRect(128, 128, 128, 128);
}).tex;
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(17, 16);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(34, 32), new THREE.MeshLambertMaterial({ map: floorTex }));
floor.rotation.x = -Math.PI / 2; floor.position.set(1, 0, -4); scene.add(floor);
const gtFloor = new THREE.Mesh(new THREE.PlaneGeometry(8, 10), M(0xf2f6f7));
gtFloor.rotation.x = -Math.PI / 2; gtFloor.position.set(14, 0.005, -11); scene.add(gtFloor);
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(34, 32), M(0x2a2d36));
ceiling.rotation.x = Math.PI / 2; ceiling.position.set(1, 6, -4); scene.add(ceiling);
// ceiling light panels
for (let x = -6; x <= 6; x += 6) for (let z = -16; z <= 9; z += 5)
  { const p = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.05, 0.8), new THREE.MeshBasicMaterial({ color: 0xfff6e0 })); p.position.set(x, 5.97, z); scene.add(p); }

// Walls
const WALL_H = 6;

const npcs = [];
function rng(seed) { let s = (seed >>> 0) || 1; return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296; }
const charMat = {};
function CM(color) { if (!charMat[color]) charMat[color] = new THREE.MeshLambertMaterial({ color }); return charMat[color]; }
const GEO = { sph: new THREE.SphereGeometry(1, 20, 14), sphLo: new THREE.SphereGeometry(1, 10, 8), caps: {} };
function capGeo(r, l) { const k = r.toFixed(4) + '_' + l.toFixed(4); return GEO.caps[k] || (GEO.caps[k] = new THREE.CapsuleGeometry(r, l, 4, 12)); }
function cmesh(geo, color, parent, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(geo, CM(color)); m.position.set(x, y, z); parent.add(m); return m; }
function ellipsoid(color, parent, sx, sy, sz, x = 0, y = 0, z = 0, lo = false) { const m = cmesh(lo ? GEO.sphLo : GEO.sph, color, parent, x, y, z); m.scale.set(sx, sy, sz); return m; }
function capsule(r, len, color, parent, x = 0, y = 0, z = 0) { return cmesh(capGeo(r, len), color, parent, x, y, z); } // runs along Y
function lathe(profile, color, parent, y = 0, zScale = 0.62, xScale = 1) {
  const pts = profile.map(([r, h]) => new THREE.Vector2(Math.max(0.001, r), h));
  const m = new THREE.Mesh(new THREE.LatheGeometry(pts, 22), CM(color)); m.position.y = y; m.scale.set(xScale, 1, zScale); parent.add(m); return m;
}
const _q = new THREE.Quaternion(), _dO = new V3();
function orient(m, dir) { _dO.copy(dir).normalize(); m.quaternion.setFromUnitVectors(UP, _dO); }

// --- Hair styles ---
function buildHair(o, head) {
  const c = o.hair, style = o.hairStyle || 'short', R = rng(o.seed || 7);
  const cap = (theta, tilt, grow = 1.04, sx = 1, sy = 1, sz = 1) => {
    const grp = new THREE.Group(); grp.rotation.x = -tilt; head.add(grp);
    const m = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 14, 0, Math.PI * 2, 0, theta), CM(c));
    m.scale.set(0.092 * grow * sx, 0.112 * grow * sy, 0.1 * grow * sz); m.position.y = 0.005; grp.add(m); return m;
  };
  const tuft = (dir, len, w, tiltDir) => {
    const p = new V3(dir.x * 0.095, dir.y * 0.115 + 0.005, dir.z * 0.103);
    const m = ellipsoid(c, head, w, len, w, p.x, p.y, p.z, true);
    orient(m, tiltDir || dir); return m;
  };
  if (style === 'messy') {          // Kennedy: brown, messy, a fringe falling forward
    cap(Math.PI * 0.56, 0.32, 1.05);
    for (let i = 0; i < 38; i++) {
      const th = R() * Math.PI * 0.5, ph = R() * Math.PI * 2;
      const d = new V3(Math.sin(th) * Math.cos(ph), Math.cos(th), Math.sin(th) * Math.sin(ph));
      if (d.z > 0.55 && d.y < 0.55) continue;
      const t = d.clone().add(new V3((R() - 0.5) * 0.9, 0.2, (R() - 0.5) * 0.9 - 0.25));
      tuft(d, 0.045 + R() * 0.03, 0.02 + R() * 0.01, t);
    }
    for (let i = 0; i < 7; i++) { const x = -0.6 + i * 0.2 + (R() - 0.5) * 0.08; tuft(new V3(x, 0.62, 0.72), 0.05, 0.018, new V3(x * 0.6 + (R() - 0.5) * 0.5, -0.45, 1)); }
  } else if (style === 'short') {   // Floyd: neat short cut with some volume on top
    cap(Math.PI * 0.5, 0.28, 1.035);
    ellipsoid(c, head, 0.082, 0.035, 0.088, 0, 0.1, 0.006);
    ellipsoid(c, head, 0.06, 0.02, 0.03, 0, 0.088, 0.07);
  } else if (style === 'sidepart') { // Dr. Hale: gray, receding, combed to the side
    cap(Math.PI * 0.5, 0.48, 1.03);
    const top = ellipsoid(c, head, 0.078, 0.03, 0.086, 0.012, 0.098, -0.004); top.rotation.z = -0.18;
    for (const s of [-1, 1]) ellipsoid(c, head, 0.016, 0.04, 0.05, s * 0.088, 0.02, -0.02, true);
  } else if (style === 'ponytail') {
    cap(Math.PI * 0.6, 0.3, 1.05);
    const pt = capsule(0.028, 0.14, c, head, 0, -0.05, -0.12); pt.rotation.x = 0.35;
    const tie = new THREE.Mesh(new THREE.TorusGeometry(0.022, 0.008, 6, 12), CM(0xc4142a)); tie.position.set(0, 0.03, -0.118); tie.rotation.x = 1.2; head.add(tie);
  } else if (style === 'buzz') {
    cap(Math.PI * 0.52, 0.3, 1.012);
  } else if (style === 'cap') {     // security guard hat
    cap(Math.PI * 0.5, 0.3, 1.02);
    cmesh(new THREE.CylinderGeometry(0.1, 0.104, 0.07, 20), 0x1a2238, head, 0, 0.1, 0);
    const brim = cmesh(new THREE.CylinderGeometry(0.075, 0.075, 0.01, 20), 0x111111, head, 0, 0.07, 0.07); brim.scale.z = 0.7;
    ellipsoid(0xffd23f, head, 0.015, 0.015, 0.004, 0, 0.11, 0.1, true);
  }
}

// --- Head with a real face ---
function buildHead(o, parent) {
  const head = new THREE.Group(); parent.add(head);
  const skin = o.skin, lip = o.lip || 0xa8645c;
  ellipsoid(skin, head, 0.092, 0.112, 0.1, 0, 0.005, 0);            // skull
  ellipsoid(skin, head, 0.076, 0.07, 0.076, 0, -0.045, 0.02);       // cheeks & jaw
  ellipsoid(skin, head, 0.032, 0.026, 0.026, 0, -0.088, 0.055);     // chin
  for (const s of [-1, 1]) ellipsoid(skin, head, 0.013, 0.027, 0.02, s * 0.091, -0.004, -0.006, true); // ears
  const eyes = [];
  for (const s of [-1, 1]) {
    const e = new THREE.Group(); e.position.set(s * 0.034, 0.012, 0.083); head.add(e);
    ellipsoid(0xf3efe6, e, 0.0145, 0.0115, 0.011, 0, 0, 0, true);
    const iris = new THREE.Group(); e.add(iris);
    ellipsoid(o.eye || 0x5a3a22, iris, 0.0082, 0.0082, 0.004, 0, 0, 0.0095, true);
    ellipsoid(0x050505, iris, 0.0042, 0.0042, 0.002, 0, 0, 0.0125, true);
    if (!o.simple) ellipsoid(0xffffff, iris, 0.0014, 0.0014, 0.001, 0.003, 0.003, 0.0135, true); // eye shine
    ellipsoid(skin, e, 0.0165, 0.0075, 0.0135, 0, 0.0105, 0.0005, true);          // upper lid
    eyes.push({ e, iris });
  }
  const brows = [];
  for (const s of [-1, 1]) {
    const b = capsule(0.0042, 0.024, o.brow || o.hair, head, s * 0.035, 0.035, 0.092);
    b.rotation.z = Math.PI / 2 - s * 0.14; brows.push(b);
  }
  const nose = capsule(0.0115, 0.026, skin, head, 0, -0.008, 0.1); nose.rotation.x = 0.42;
  ellipsoid(skin, head, 0.017, 0.0105, 0.013, 0, -0.026, 0.101, true);           // nose tip / nostrils
  if (!o.simple) for (const s of [-1, 1]) ellipsoid(0x2a1610, head, 0.004, 0.0025, 0.003, s * 0.007, -0.033, 0.104, true);
  const mouthIn = ellipsoid(0x3a1414, head, 0.017, 0.004, 0.006, 0, -0.054, 0.09, true);
  const lipU = capsule(0.0055, 0.022, lip, head, 0, -0.049, 0.092); lipU.rotation.z = Math.PI / 2;
  const lipL = capsule(0.0065, 0.019, lip, head, 0, -0.059, 0.09); lipL.rotation.z = Math.PI / 2;
  if (o.beard) ellipsoid(o.hair, head, 0.07, 0.04, 0.06, 0, -0.07, 0.03);
  buildHair(o, head);
  if (o.glasses) {

function snapPart(o) {

  Q.base.attach(o.mesh); o.mesh.position.copy(o.slot); o.mesh.rotation.set(0, 0, 0);

}
function equipShooter(side) {

// ===================================================================
// SECTION 14b: PERFORMANCE — merge static scenery into fewer draw calls
// ===================================================================
function mergeStatic(exclude) {
  const groups = new Map();
  for (const m of [...scene.children]) {
    if (!m.isMesh || exclude.has(m) || Array.isArray(m.material)) continue;
    const k = m.material.uuid; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(m);
  }
  for (const list of groups.values()) {
    if (list.length < 2) continue;
    const geos = [];
    for (const m of list) {
      m.updateMatrixWorld(true);
      const g = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone();
      g.applyMatrix4(m.matrixWorld);
      if (!g.attributes.normal || !g.attributes.uv) { geos.length = 0; break; }
      geos.push(g);
    }
    if (!geos.length) continue;
    let n = 0; for (const g of geos) n += g.attributes.position.count;
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), uv = new Float32Array(n * 2);
    let o = 0;
    for (const g of geos) {
      pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3); uv.set(g.attributes.uv.array, o * 2);
      o += g.attributes.position.count; g.dispose();
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3)); geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    geo.computeBoundingSphere();
    const merged = new THREE.Mesh(geo, list[0].material); merged.renderOrder = list[0].renderOrder; scene.add(merged);
    for (const m of list) scene.remove(m);
  }
}

};

const KENNEDY_EYE = 1.62;
let standEye = KENNEDY_EYE, heightDone = false, recalibrate = false, heightOffset = 0;
let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000)); last = now;
  if (mode === 'menu') { renderer.render(scene, camera); return; }
  T += dt;
  if (renderer.xr.isPresenting) { try { renderer.xr.updateCamera(camera); } catch (e) {} }

    if (!hero.enabled) rig.position.y = heightOffset;
    heightDone = true; recalibrate = false;
  }
  readInput(dt);
  rig.updateMatrixWorld(true);
  if (mode === 'desktop' && deskE) { deskE = false; deskInteract(); }
  deskE = false;
  updateHands(dt);
  checkTouches();
  updateBody(dt);
  for (const n of npcs) n.update(dt, T);
  updateWorld(dt);
  checkWaiters();
  renderer.render(scene, camera);
});
