/* ---------------- COLLISION WORLD ---------------- */

const XR = [];

function xrayUpdate(dt) {

/* ---------- desktop test keys for weapons ---------- */
addEventListener('keydown', ev => {
  if (!desktop || !started) return;
  if (ev.code === 'Digit1') { for (const i of [0, 1]) { const b = BATONS[i]; if (b.state === 'holster') attachBaton(b, hands[i]); else if (b.state === 'hand') holsterBaton(b); } SFX.split(); }
  if (ev.code === 'Digit2') { if (STAFF.state === 'hand' && STAFF.holders.length === 2) splitStaff(); else if (BATONS[0].state === 'hand' && BATONS[1].state === 'hand') combineStaff(); }
  if (ev.code === 'Digit3') { const h = hands[1]; if (h.pw) { h.wv.copy(headFwd).multiplyScalar(9).add(new V3(0, 2, 0)); releasePW(h); } }
  if (ev.code === 'Digit4') { startRecall(hands[1]) || startRecall(hands[0]); }
  if (ev.code === 'Digit5') { const order = ['wood', 'steel', 'weighted']; SET.staffMat = order[(order.indexOf(SET.staffMat) + 1) % 3]; applyWeaponMat(); saveSet(); setLabel(WMAT[SET.staffMat].name, 1); }
});

/* ---------------- HEIGHT CALIBRATION (player + enemies scale to you) ---------------- */
const EYE_RATIO = 0.936, ENEMY_NOMINAL_H = 1.82;

function enemyBaseScale() { return clamp(SET.playerH || SET.standH / 0.936, 1.3, 2.2) / 1.82; }
function applyHeight() {
  const k = clamp(SET.playerH, 1.3, 2.2) / 1.78;
  ARM.upper = 0.30 * k; ARM.fore = 0.28 * k;
  const base = enemyBaseScale();
  for (const e of ENEMIES) { e.sc = base * (e.scVar || 1); e.root.scale.setScalar(e.sc); }
}
function setPlayerHeight(h) {
  SET.playerH = clamp(h, 1.3, 2.2); SET.standH = SET.playerH * EYE_RATIO; saveSet(); applyHeight(); if (MENU.open) drawMenu();
}
const CAL = { t: -1, max: 0, shown: -1 };

applyHeight();

/* ---------------- MAIN GAMEPLAY ---------------- */
function gameplay(dt) {
  qYaw.setFromAxisAngle(UP, P.yaw);
  headFwd.set(0, 0, -1).applyQuaternion(headQL); headFwd.y = 0; if (headFwd.lengthSq() < 1e-4) headFwd.set(0, 0, -1); headFwd.normalize().applyQuaternion(qYaw);

  runDir.copy(headFwd);

    tA.set(0, 0, -1).applyQuaternion(hands[0].q).add(tB.set(0, 0, -1).applyQuaternion(hands[1].q)); tA.y = 0;
    if (tA.lengthSq() > 0.05) runDir.copy(tA.normalize().applyQuaternion(qYaw));

  P.turnCd -= dt;

    if (SET.turn === 'snap') { if (Math.abs(IN.rx) > 0.72 && P.turnCd <= 0 && Math.abs(IN.rx) > Math.abs(IN.ry)) { P.yaw -= Math.sign(IN.rx) * Math.PI / 6; P.turnCd = 0.28; } if (Math.abs(IN.rx) < 0.3) P.turnCd = Math.min(P.turnCd, 0); }

/* ---------------- FADE / OVERLAY ---------------- */
const FADE = { v: 1 };
let heartT = 0;
function overlayUpdate(dt) {
  const sp = Math.hypot(P.vel.x, P.vel.z);
  let vig = 0;
  if (SET.vignette) { if (!P.onGround || sp > 6.5) vig = clamp((sp - 6) / 7, 0, 0.42); if (P.swingB) vig = Math.max(vig, 0.3); }
  if (SET.flip === 'comfort') { if (P.flip) vig = Math.max(vig, Math.sin(Math.PI * clamp(P.flip.t / P.flip.dur, 0, 1)) * 0.95); if (P.roll) vig = Math.max(vig, Math.sin(Math.PI * clamp(P.roll.t / P.roll.dur, 0, 1)) * 0.8); }
  ovMat.uniforms.uVig.value = lerp(ovMat.uniforms.uVig.value, vig, Math.min(1, dt * 8));
  P.redFlash = Math.max(0, P.redFlash - dt * 0.9);
  const low = P.hp < 40 ? (40 - P.hp) / 40 * 0.7 : 0;
  ovMat.uniforms.uRed.value = Math.max(P.redFlash, low);
  if (P.dead) FADE.v = Math.min(1, P.dead * 2.2); else FADE.v = Math.max(0, FADE.v - dt * 1.2);
  ovMat.uniforms.uFade.value = FADE.v;
  if (P.hp < 35 && !P.dead) { heartT -= dt; if (heartT <= 0) { SFX.heart(); heartT = 0.85; } }

  if (SUB.cur) { SUB.cur.t += dt; const k = SUB.cur.t, d = SUB.cur.dur; subMesh.material.opacity = Math.min(1, k * 3, (d - k) * 2); if (k > d) { SUB.cur = null; subMesh.material.opacity = 0; } }

/* ---------------- LOOP ---------------- */
const clock = new THREE.Clock();
function loop(t, frame) {
  const dt = Math.min(clock.getDelta(), 0.05); time += dt;
  if (!started) { renderer.render(scene, camera); return; }
  if (renderer.xr.isPresenting) { renderer.xr.updateCamera(camera); readXR(frame, dt); } else readDesktop(dt);
  if (!camInit) { prevCam.copy(camLocal); velCam.copy(camLocal); for (const h of hands) h.prev.copy(h.local); camInit = true; }
  headVel.copy(camLocal).sub(velCam).divideScalar(Math.max(dt, 1e-3)); velCam.copy(camLocal);
  for (const h of hands) { h.vel.copy(h.local).sub(h.prev).divideScalar(Math.max(dt, 1e-3)); h.prev.copy(h.local); }
  if (MENU.open) menuUpdate(); else gameplay(dt);
  prevCam.copy(camLocal);
  updateRig();
  if (started) handContacts(dt);
  if (started) pwUpdate(dt);
  handVisuals();
  armsUpdate(dt);
  bodyUpdate(dt);
  combatUpdate(dt);
  weatherUpdate(dt);
  overlayUpdate(dt);
  // audio

    const sp = P.vel.length(), air = !P.onGround && P.grabHand < 0;
    AU.windG.gain.value = lerp(AU.windG.gain.value, clamp((sp - 3) / 10, 0, 0.55) * (air ? 1.2 : 0.7), Math.min(1, dt * 5));
    AU.windF.frequency.value = 280 + sp * 55;

  }

  rainMat.uniforms.uCam.value.copy(cw); sky.position.copy(cw);

  const gb = groundBelow(P.pos.x, P.pos.z, P.pos.y + 0.05);
  if (gb) { const hgt = P.pos.y - gb.y1; blob.visible = hgt < 40; blob.position.set(P.pos.x, gb.y1 + 0.03, P.pos.z); const s = 0.7 + hgt * 0.03; blob.scale.set(s, s, 1); blob.material.opacity = clamp(0.85 - hgt * 0.025, 0.2, 0.85); } else blob.visible = false;

}
renderer.setAnimationLoop(loop);

/* ---------------- START ---------------- */
const ui = document.getElementById('ui'), vrBtn = document.getElementById('vrBtn'), deskBtn = document.getElementById('deskBtn'), st = document.getElementById('st');
function beginGame() {
  started = true; camInit = false; ui.style.display = 'none';
  P.pos.copy(SPAWN); P.vel.set(0, 0, 0); P.yaw = -Math.PI / 2; FADE.v = 1; P.hp = 100; P.calibT = 1.5;
  SUB.queue.length = 0; SUB.cur = null;
  say('Blackwater. It never stops raining here.', 3.6, 1.0);
  say('Every night, someone bleeds. Every night… I hunt.', 3.8, 0.5);
  say('First, I own these rooftops.', 3.2, 0.5);
  setLabel('CATHEDRAL QUARTER', 4);
}
deskBtn.disabled = false; deskBtn.textContent = 'PLAY ON DESKTOP (TEST)';
deskBtn.onclick = () => { initAudio(); desktop = true; document.getElementById('dhud').style.display = 'block'; document.getElementById('cross').style.display = 'block'; beginGame(); renderer.domElement.requestPointerLock(); };
if (navigator.xr) {
  navigator.xr.isSessionSupported('immersive-vr').then(ok => {
    vrBtn.disabled = !ok; vrBtn.textContent = ok ? 'ENTER VR' : 'VR NOT AVAILABLE HERE';
    if (!ok) st.textContent = 'Open this page in the Meta Quest Browser to play in VR. Desktop test mode works here.';
  }).catch(() => { vrBtn.textContent = 'VR NOT AVAILABLE HERE'; });
} else { vrBtn.textContent = 'VR NOT AVAILABLE HERE'; st.textContent = 'Open this page in the Meta Quest Browser to play in VR. Desktop test mode works here.'; }
vrBtn.onclick = async () => {
  initAudio();
  try {
    const session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor'] });
    renderer.xr.setFoveation(0.7);
    await renderer.xr.setSession(session);
    desktop = false; beginGame();
    session.addEventListener('end', () => { started = false; ui.style.display = 'flex'; closeMenu(); });
  } catch (e) { st.textContent = 'Could not start VR: ' + e.message; }
};
