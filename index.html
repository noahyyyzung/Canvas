<script type="module">
import * as THREE from 'three';

// ================= basics =================

// ================= noise =================
let SEED = 1;
function hash3(x, y, z, s = SEED) {

// ================= space environment =================

{ // nebula sky

const NOR = new Float32Array(NV * 3), COL = new Float32Array(NV * 3), GLOW = new Float32Array(NV), WETA = new Float32Array(NV);

for (let k = 0; k < IDX.length; k++) VFS[IDX[k] + 1]++;

{ const lists = new Array(NV);
  for (let i = 0; i < NV; i++) { const s = new Set(); for (let k = VFS[i]; k < VFS[i + 1]; k++) { const f = VF[k] * 3; for (let j = 0; j < 3; j++) { const v = IDX[f + j]; if (v !== i) s.add(v); } } lists[i] = [...s]; NBS[i + 1] = NBS[i] + lists[i].length; }

{ const cellOf = new Uint32Array(NV);
  for (let i = 0; i < NV; i++) { const [f, a, b] = cubeCell(DIR[i * 3], DIR[i * 3 + 1], DIR[i * 3 + 2]); cellOf[i] = f * GN * GN + a * GN + b; GS[cellOf[i] + 1]++; }

// ================= palette =================

const SW = [0x4f8f3a, 0x2e6b2f, 0x7fbf4a, 0x9acd32, 0xd9c38b, 0xc2a26b, 0x8b6b4a, 0x5a4636,
  0x7a7a7a, 0x4a4a4f, 0xbfbfbf, 0xffffff, 0x1e5a99, 0x2f7fd0, 0x5fc7e8, 0x0b2a4a,
  0xff6fb5, 0xd94fa0, 0x9b59d0, 0x5b2a86, 0xe8492e, 0xff8a1f, 0xffc93c, 0xb3261e,
  0x00ffa6, 0x39ff14, 0x00e5ff, 0x111111, 0x6b8e23, 0xe0f7ff, 0xffd1dc, 0x2b1b3f];

// ================= state =================
const state = { tab: 0, tool: 'raise', size: 0.12, strength: 0.5, brushCol: 16, colTarget: 'grass', sea: 0, density: 1, clouds: true, cloudAmt: 0.5, atmo: 1, spin: false, sound: true, preset: 'earth', msg: '', msgT: 0, temp: 0, moist: 0 };
let dirty = false, vegDirty = false, uiDirty = false, geoDirty = { pos: false, col: false };

    case 'sea': pushUndo(); state.sea = clamp(state.sea + { '--': -.02, '-': -.005, '+': .005, '++': .02 }[v], -.3, .25); water.scale.setScalar(1 + state.sea); recolorAll(); vegDirty = true; dirty = true; break;

    case 'cloud': state.cloudAmt = clamp(state.cloudAmt + (v === '+' ? .1 : -.1), 0, 1); drawClouds(); dirty = true; break;

}
function bringPlanet() {

}

// ================= brush cursor & laser =================
const ring = new THREE.Mesh(new THREE.RingGeometry(.9, 1, 64), new THREE.MeshBasicMaterial({ color: 0x9fe8ff, transparent: true, opacity: .85, depthTest: false, side: THREE.DoubleSide, toneMapped: false }));
ring.renderOrder = 15; ring.visible = false; scene.add(ring);
const ringDot = new THREE.Mesh(new THREE.CircleGeometry(.08, 16), ring.material); ring.add(ringDot);
function toolColor() { const t = state.tool; if (t === 'paint') return SW[state.brushCol]; if (t.startsWith('biome:')) { const b = BIOMES.find(x => x[0] === +t.slice(6)); return b[2] ? palHex[b[2]] : 0xcccccc; } if (t.startsWith('water')) return 0x5fb8ff; if (t.startsWith('plants')) return 0x7dff7a; if (t === 'mat:4' || t === 'volcano') return 0xff7a3a; if (t.startsWith('mat:')) return 0xffe0a0; return 0x9fe8ff; }
const hitLocal = new V3();
function showRing(dir) {
  const vi = nearest(dir.x, dir.y, dir.z); const r = 1 + Math.max(H[vi], state.sea) + .004;

  tv2.copy(dir).applyQuaternion(planet.quaternion); ring.quaternion.setFromUnitVectors(new V3(0, 0, 1), tv2);

const inv = new THREE.Matrix4(), lo = new V3(), ld = new V3();
function rayPlanet(origin, dirW, out) {

const raycaster = new THREE.Raycaster();
function rayUI(origin, dirW) { if (!uiHolder.visible) return null; raycaster.set(origin, dirW); raycaster.far = 6; const h = raycaster.intersectObject(ui.mesh, false); return h.length ? h[0] : null; }
function makeLaser() { const g = new THREE.Group(); const geo = new THREE.BufferGeometry().setFromPoints([new V3(0, 0, 0), new V3(0, 0, -1)]); const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0x9fd0ff, transparent: true, opacity: .7, toneMapped: false })); g.add(line); const dot = new THREE.Mesh(new THREE.SphereGeometry(.006, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false })); g.add(dot); g.userData = { line, dot }; return g; }

// ================= XR hands =================
const hands = {};
function makeHand(side) {

  const fingers = []; [.026, .009, -.008, -.025].forEach((y, i) => { const f = new THREE.Group(); f.position.set(0, y, -.032); const L = [.07, .075, .07, .055][i]; const fm = new THREE.Mesh(new THREE.BoxGeometry(.017, .016, L), m); fm.position.z = -L / 2; f.add(fm); g.add(f); fingers.push(f); });
  const th = new THREE.Group(); th.position.set(-s * .012, .035, 0); const tmm = new THREE.Mesh(new THREE.BoxGeometry(.018, .018, .05), m); tmm.position.z = -.025; th.add(tmm); th.rotation.set(.35, s * .5, 0); g.add(th);

for (let i = 0; i < 2; i++) {
  const ray = renderer.xr.getController(i), grip = renderer.xr.getControllerGrip(i); dolly.add(ray); dolly.add(grip);
  ray.addEventListener('connected', e => {

    const h = hands[src.handedness] || (hands[src.handedness] = makeHand(src.handedness));
    h.ray = ray; h.grip = grip; h.src = src; grip.add(h.model);
    if (src.handedness === 'right') { if (!h.laser) h.laser = makeLaser(); ray.add(h.laser); }
    else { grip.add(uiHolder); uiHolder.position.set(0, .1, -.06); uiHolder.rotation.set(-1.0, 0, 0); uiHolder.visible = true; }
  });
  ray.addEventListener('disconnected', () => { for (const k in hands) if (hands[k].ray === ray) { hands[k].src = null; hands[k].ok = false; } });
}
renderer.xr.addEventListener('sessionstart', () => { SND.init(); planet.position.set(0, 1.3, -.85); spin.vel = 0; });
renderer.xr.addEventListener('sessionend', () => { placeUIDesktop(); ring.visible = false; if (dirty) saveSlot('auto', true); camera.position.set(0, 1.5, .5); camera.lookAt(0, 1.35, -.85); });
function rotateDolly(a) { camera.getWorldPosition(tv1); dolly.position.sub(tv1).applyAxisAngle(UP, a).add(tv1); dolly.rotation.y += a; }

// ================= planet grabbing =================
const grab = { mode: 0, h: null, near: false, m0: new THREE.Matrix4(), pm0: new THREE.Matrix4(), q0: new THREE.Quaternion(), hq0: new THREE.Quaternion(), v0: new V3(), mid0: new V3(), p0: new V3(), s0: 1, lastQ: new THREE.Quaternion() };
const spin = { axis: new V3(0, 1, 0), vel: 0 };
function initOne(h) {
  grab.h = h; h.grip.getWorldPosition(tv1); grab.near = tv1.distanceTo(planet.position) < planet.scale.x * 1.3 + .1;
  grab.m0.copy(h.grip.matrixWorld).invert(); planet.updateMatrix(); grab.pm0.copy(planet.matrix);
  h.grip.getWorldQuaternion(grab.hq0); grab.q0.copy(planet.quaternion); SND.grab();
}
function updOne() {
  const h = grab.h;
  if (grab.near) { tm1.multiplyMatrices(h.grip.matrixWorld, grab.m0).multiply(grab.pm0); const s = planet.scale.x; tm1.decompose(planet.position, planet.quaternion, tv3); planet.scale.setScalar(s); }
  else { h.grip.getWorldQuaternion(tq1); tq2.copy(grab.hq0).invert(); tq1.multiply(tq2); tq3.copy(tq1).multiply(tq1); planet.quaternion.copy(tq3).multiply(grab.q0); }
}
function initTwo(L, R) { L.grip.getWorldPosition(tv1); R.grip.getWorldPosition(tv2); grab.v0.subVectors(tv2, tv1); grab.mid0.addVectors(tv1, tv2).multiplyScalar(.5); grab.p0.copy(planet.position); grab.s0 = planet.scale.x; grab.q0.copy(planet.quaternion); SND.grab(); }
function updTwo(L, R) {
  L.grip.getWorldPosition(tv1); R.grip.getWorldPosition(tv2); const v = tv3.subVectors(tv2, tv1), mid = tv4.addVectors(tv1, tv2).multiplyScalar(.5);

// ================= XR input =================
function xrInput(dt) {
  const L = hands.left, R = hands.right;
  for (const h of [L, R]) {
    if (!h) continue; if (!h.src || !h.src.gamepad) { h.ok = false; continue; }
    h.ok = true; const gp = h.src.gamepad, bt = i => gp.buttons[i];

  }

  if (dn(R, 'a')) doUndo(); if (dn(R, 'b')) doRedo();
  if (dn(L, 'a')) { state.spin = !state.spin; toast(state.spin ? 'Auto-spin ON' : 'Auto-spin OFF'); }
  if (dn(L, 'b')) { uiHolder.visible = !uiHolder.visible; SND.click(); }
  handleGrab(L, R, dt);
  stroke.smoothMod = !!(L && L.ok && L.cur.trig > .5);
  ring.visible = false;
  if (R && R.ok) {
    R.ray.getWorldPosition(tv1); tv2.set(0, 0, -1).transformDirection(R.ray.matrixWorld);
    const uh = rayUI(tv1, tv2);
    if (uh) { setLaser(R.laser, uh.distance, 0xffffff); if (dn(R, 'tp')) pressUV(uh.uv); if (stroke.active) endStroke(); }
    else if (rayPlanet(tv1, tv2, hitLocal)) {

      const rightBusy = grab.mode === 2 || (grab.mode === 1 && grab.h === R);

      else if (stroke.active && R.cur.trig > .05) { applyTool(hitLocal, dt, state.strength * clamp(R.cur.trig * 1.2, 0, 1), false); pulse(R, .08 + state.strength * .15, 16); }

  for (const h of [L, R]) {

    const g = h.cur.grip ? 1 : 0; h.fingers.forEach((f, i) => { const c = i === 0 ? h.cur.trig : g; f.rotation.y = lerp(f.rotation.y, h.s * c * 1.3, .4); });

function pulse(h, i, ms) { try { const a = h.src.gamepad.hapticActuators; if (a && a[0]) a[0].pulse(i, ms); } catch (e) { } }

// ================= desktop =================
const mouse = { down: false, btn: -1, x: 0, y: 0, lx: 0, ly: 0, nx: 0, ny: 0 };
const cvs = renderer.domElement;
function mouseRay() { raycaster.setFromCamera({ x: mouse.nx, y: mouse.ny }, camera); return raycaster.ray; }
cvs.addEventListener('contextmenu', e => e.preventDefault());
cvs.addEventListener('pointerdown', e => {
  SND.init(); mouse.down = true; mouse.btn = e.button; mouse.lx = e.clientX; mouse.ly = e.clientY; setMouse(e);
  if (e.button === 0) {
    const r = mouseRay(); const o = r.origin.clone(), d = r.direction.clone();

  }
});
function setMouse(e) { mouse.x = e.clientX; mouse.y = e.clientY; mouse.nx = e.clientX / innerWidth * 2 - 1; mouse.ny = -(e.clientY / innerHeight) * 2 + 1; }

addEventListener('pointerup', () => { mouse.down = false; endStroke(); });

function desktopUpdate(dt) {

  if (!rayUI(o, d) && rayPlanet(o, d, hitLocal)) { showRing(hitLocal); if (stroke.active && mouse.down && mouse.btn === 0) applyTool(hitLocal, dt, state.strength, false); }

// ================= main loop =================
let last = performance.now(), vegT = 0, saveT = 0, sndT = 0;
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(.05, (now - last) / 1000); last = now; time += dt;

// ================= start =================
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timed out')), ms))]);

const nextFrame = () => new Promise(r => setTimeout(r, 30));
(async () => {

})();
