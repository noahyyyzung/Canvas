    :root {

      --panel: rgba(11, 18, 32, 0.9);
      --panel-solid: #0c1424;

      --border: rgba(59, 130, 246, 0.28);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;

    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;

      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* HUD */
    #hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: none;
    }

    .hud-top {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hud-pill {
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      pointer-events: auto;
    }

    .hud-title {
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--cobalt-bright);
    }

    .hud-stat {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .hud-stat span {
      color: var(--muted);
      font-weight: 500;
      font-size: 11px;
      margin-right: 4px;
    }

    .hud-cash {
      color: var(--success);
      font-weight: 700;
      font-size: 14px;
    }

    /* GPS Compass Banner */
    #gps-banner {
      position: absolute;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid var(--cobalt-bright);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 700;
      color: #dbeafe;
      display: none;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
      pointer-events: auto;
    }

    #gps-banner button {
      background: transparent;
      border: none;
      color: #93c5fd;
      cursor: pointer;
      font-weight: 800;
      font-size: 12px;
    }

    #swim-banner {
      position: absolute;
      top: 114px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(14, 116, 144, 0.85);
      border: 1px solid #38bdf8;
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 12px;
      font-weight: 700;
      color: #e0f2fe;
      display: none;
    }

    .hud-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: rgba(30, 58, 138, 0.55);
      border-color: var(--cobalt-bright);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-color: #60a5fa;
      color: #fff;
      box-shadow: 0 4px 16px var(--cobalt-glow);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #3b82f6, #2563eb);

    .btn-danger {

    }

    .btn-danger:hover {
      background: rgba(185, 28, 28, 0.75);

    .btn-sm {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 8px;
    }

    /* Crosshair & Interaction Prompt */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      margin: -4px 0 0 -4px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.75);
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
      transition: transform 0.12s ease, background 0.12s ease;
    }

    #crosshair.active {
      transform: scale(1.65);
      background: var(--cobalt-bright);
      box-shadow: 0 0 12px var(--cobalt-bright);
    }

    #interact-prompt {
      position: absolute;
      top: calc(50% + 22px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid var(--cobalt-bright);
      border-radius: 10px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.12s ease;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }

    #interact-prompt.visible {
      opacity: 1;
    }

    #interact-prompt .key-badge {
      display: inline-block;
      background: var(--cobalt);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 5px;
      margin-right: 6px;
    }

    #held-indicator {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 13px;
      color: var(--text);
      display: none;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    /* Toast */
    #toast-container {
      position: fixed;
      bottom: 72px;
      right: 16px;
      z-index: 60;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      background: var(--panel-solid);
      border: 1px solid var(--cobalt-bright);
      border-left: 4px solid var(--cobalt-bright);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #controls-hint {
      position: absolute;
      bottom: 14px;
      left: 14px;
      background: rgba(7, 11, 20, 0.74);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 11px;
      color: var(--muted);
      max-width: 520px;
      line-height: 1.45;
    }

    #controls-hint strong {
      color: var(--text);
    }

    /* Touch Controls */
    #touch-controls {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
    }

    .touch-pad {
      position: absolute;
      bottom: 24px;
      left: 20px;
      width: 116px;
      height: 116px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid var(--border);
      pointer-events: auto;
      touch-action: none;
    }

    .touch-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 44px;
      height: 44px;
      margin: -22px 0 0 -22px;
      border-radius: 50%;
      background: var(--cobalt-bright);
      opacity: 0.85;
    }

    .touch-buttons {
      position: absolute;
      bottom: 24px;
      right: 20px;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    /* Overlays & Modals */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: radial-gradient(circle at 50% 20%, rgba(30, 58, 138, 0.35), rgba(7, 11, 20, 0.94));

      align-items: center;
      justify-content: center;

      overflow-y: auto;

    .overlay.hidden {
      display: none;

    .brand-header {
      display: flex;

    .brand-badge {
      display: inline-block;

      letter-spacing: 0.12em;
      text-transform: uppercase;

      padding: 4px 10px;
      border-radius: 999px;

    h1 {

    .subtitle {
      font-size: 13px;

      margin-top: 4px;
    }

    .xr-status-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .xr-status-badge.ready {
      border-color: rgba(34, 197, 94, 0.55);
      color: #86efac;
    }

    .slots-grid {
      display: grid;

    .slot-card {
      background: rgba(15, 23, 42, 0.78);

    .slot-card:hover {

    .slot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;

      letter-spacing: 0.08em;
      color: var(--cobalt-bright);
      text-transform: uppercase;
    }

    .slot-name {
      font-size: 16px;

    }

    .name-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .input {
      flex: 1;

      background: #070b14;
      border: 1px solid var(--border);

      padding: 10px 12px;

    .controls-box {

    /* ============================================================
       VANTA SMARTPHONE OS OVERLAY
       ============================================================ */
