  const raw = sum / 2;
  P.swingSm += (raw - P.swingSm) * (1 - Math.exp(-dt / (raw > P.swingSm ? 0.16 : 0.42)));
  const lo = 0.35, hi = 2.3 / SET.sens;

  P.armPeak = Math.max(P.armPeak - dt * 5, cnt ? up / cnt : 0);
  P.armUp = clamp((P.armPeak - 0.8) / 2.2, 0, 1);
}

/* ---------------- MENU ---------------- */
const MENU = { open: false, hover: -1 };
const menuCv = canvas(1024, 900), menuG = menuCv.getContext('2d'), menuTex = texFrom(menuCv, true, false);
const menuMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.879), new THREE.MeshBasicMaterial({ map: menuTex, transparent: true, toneMapped: false, depthTest: false }));
menuMesh.renderOrder = 998; menuMesh.visible = false; scene.add(menuMesh);
const sensName = () => SET.sens < 0.9 ? 'LOW' : SET.sens > 1.1 ? 'HIGH' : 'NORMAL';
const MITEMS = [
  { id: 'resume', label: () => 'RESUME' },
  { id: 'flip', label: () => 'FLIPS:  ' + (SET.flip === 'full' ? 'FULL ROTATION' : 'COMFORT') },
  { id: 'turn', label: () => 'TURNING:  ' + (SET.turn === 'snap' ? 'SNAP 30°' : 'SMOOTH') },
  { id: 'vig', label: () => 'COMFORT VIGNETTE:  ' + (SET.vignette ? 'ON' : 'OFF') },
  { id: 'dir', label: () => 'RUN DIRECTION:  ' + (SET.runDir === 'head' ? 'WHERE YOU LOOK' : 'WHERE HANDS POINT') },
  { id: 'sens', label: () => 'ARM-SWING SENSITIVITY:  ' + sensName() },
  { id: 'height', label: () => 'RECALIBRATE HEIGHT (STAND TALL)  ·  ' + SET.standH.toFixed(2) + ' m' },
  { id: 'respawn', label: () => 'RESPAWN AT LAST CHECKPOINT' },
];
function drawMenu() {
  const g = menuG; g.clearRect(0, 0, 1024, 900);
  g.fillStyle = 'rgba(6,5,7,0.93)'; g.fillRect(0, 0, 1024, 900); g.fillStyle = '#9e1119'; g.fillRect(0, 0, 1024, 12);
  g.font = 'bold 78px Impact, "Arial Black", sans-serif'; g.fillStyle = '#c8141e'; g.fillText('RECKONER', 48, 110);
  g.font = '26px "Segoe UI", Arial'; g.fillStyle = '#888'; g.fillText('PAUSED · STAGE 1 · point with the right hand, pull the trigger', 50, 152);
  MITEMS.forEach((it, i) => {
    const y = 190 + i * 84;
    g.fillStyle = i === MENU.hover ? 'rgba(160,16,26,0.85)' : 'rgba(255,255,255,0.06)'; g.fillRect(40, y, 944, 70);
    g.font = 'bold 32px "Segoe UI", Arial'; g.fillStyle = '#f2f2f2'; g.fillText(it.label(), 66, y + 47);
  });
  g.font = '22px "Segoe UI", Arial'; g.fillStyle = '#666'; g.fillText('made by Noah Young.', 50, 880);
  menuTex.needsUpdate = true;
}
function openMenu() {
  MENU.open = true; MENU.hover = -1; drawMenu();
  const hw = tA.copy(camLocal).applyMatrix4(rig.matrixWorld);
  menuMesh.position.copy(hw).addScaledVector(headFwd, 1.15); menuMesh.position.y = hw.y - 0.1;
  menuMesh.lookAt(hw.x, menuMesh.position.y, hw.z); menuMesh.visible = true; laser.visible = true; SFX.click();
}
function closeMenu() { MENU.open = false; menuMesh.visible = false; laser.visible = false; }
const ray = new THREE.Raycaster();
function menuUpdate() {
  if (IN.yE) { closeMenu(); return; }
  const h = hands[1]; h.root.updateMatrixWorld(true);
  const o = tA.setFromMatrixPosition(h.root.matrixWorld), d = tB.set(0, 0, -1).applyQuaternion(h.root.getWorldQuaternion(tQ));
  ray.set(o, d); const hit = ray.intersectObject(menuMesh)[0];
  let hov = -1;
  if (hit && hit.uv) { const py = (1 - hit.uv.y) * 900; const i = Math.floor((py - 190) / 84); if (i >= 0 && i < MITEMS.length && (py - 190) % 84 < 70) hov = i; laser.scale.z = hit.distance; } else laser.scale.z = 2;
  if (hov !== MENU.hover) { MENU.hover = hov; drawMenu(); if (hov >= 0) buzz(h, 0.2, 15); }
  if ((IN.trigRE || IN.trigLE) && hov >= 0) {
    SFX.click(); const id = MITEMS[hov].id;
    if (id === 'resume') { closeMenu(); return; }
    if (id === 'flip') SET.flip = SET.flip === 'full' ? 'comfort' : 'full';
    if (id === 'turn') SET.turn = SET.turn === 'snap' ? 'smooth' : 'snap';
    if (id === 'vig') SET.vignette = !SET.vignette;
    if (id === 'dir') SET.runDir = SET.runDir === 'head' ? 'hands' : 'head';
    if (id === 'sens') SET.sens = SET.sens < 0.9 ? 1 : SET.sens < 1.1 ? 1.35 : 0.75;
    if (id === 'height') SET.standH = clamp(camLocal.y, 1.2, 2.2);
    if (id === 'respawn') { closeMenu(); die(); }
    saveSet(); drawMenu();
  }
}

/* ---------------- WEATHER ---------------- */
const WX = { int: 0.65, target: 0.75, next: 30, flash: 0, ft: 99, lt: 7, sirenT: 25, boltT: 0 };
function strike() {
  WX.ft = 0; WX.boltT = 0.28;
  const a = Math.random() * Math.PI * 2, dist = 140 + Math.random() * 220, cx = P.pos.x + Math.cos(a) * dist, cz = P.pos.z + Math.sin(a) * dist;
  const arr = boltGeo.attributes.position.array; let x = cx, y = 260, z = cz;
  for (let i = 0; i < 26; i++) { arr[i * 3] = x; arr[i * 3 + 1] = y; arr[i * 3 + 2] = z; x += (Math.random() - 0.5) * 14; z += (Math.random() - 0.5) * 14; y -= 9 + Math.random() * 3; }
  boltGeo.attributes.position.needsUpdate = true;
  SFX.thunder(dist);
}
function weatherUpdate(dt) {
  WX.next -= dt; if (WX.next <= 0) { WX.target = Math.random() < 0.3 ? 1 : 0.25 + Math.random() * 0.7; WX.next = 25 + Math.random() * 40; }
  WX.int += (WX.target - WX.int) * Math.min(1, dt * 0.05);
  WX.lt -= dt * (0.3 + WX.int); if (WX.lt <= 0) { if (WX.int > 0.55) strike(); WX.lt = 5 + Math.random() * 16; }
  WX.ft += dt; const t = WX.ft;
  WX.flash = t < 0.06 ? 1 : t < 0.12 ? 0.25 : t < 0.2 ? 0.85 : Math.max(0, 0.85 - (t - 0.2) * 3.5);
  WX.boltT -= dt; boltMat.opacity = WX.boltT > 0 ? Math.min(1, WX.flash + 0.3) : 0;
  hemi.intensity = 0.8 + WX.flash * 2.4; moon.intensity = 0.85 + WX.flash * 2.6;
  skyMat.uniforms.uFlash.value = WX.flash; skyMat.uniforms.uStorm.value = WX.int; skyMat.uniforms.uTime.value = time;
  scene.fog.density = 0.0085 + 0.0055 * WX.int; scene.fog.color.copy(FOG_BASE).lerp(FOG_FLASH, WX.flash * 0.5);
  rainMat.uniforms.uAlpha.value = 0.22 + 0.4 * WX.int; rainMat.uniforms.uDen.value = 0.3 + 0.7 * WX.int; rainMat.uniforms.uFlash.value = WX.flash; rainMat.uniforms.uTime.value = time;
  rainMat.uniforms.uWind.value.set(1.2 + WX.int * 2.2, 0.6 + WX.int);
  if (AU.ctx) { AU.rainG.gain.value = 0.05 + 0.24 * WX.int; AU.rain2G.gain.value = 0.04 + 0.16 * WX.int; }
  WX.sirenT -= dt; if (WX.sirenT <= 0) { SFX.siren(); WX.sirenT = 40 + Math.random() * 60; }
}

/* ---------------- RIG / VISUALS ---------------- */
function updateRig() {
  qYaw.setFromAxisAngle(UP, P.yaw); rigQ.copy(qYaw);
  let rollDip = 0;
  if (SET.flip === 'full') {
    if (P.flip) { tQ.setFromAxisAngle(P.flip.axis, P.flip.sign * easeIO(P.flip.t / P.flip.dur) * Math.PI * 2); rigQ.multiply(tQ); }
    else if (P.roll) { tQ.setFromAxisAngle(P.roll.axis, -easeIO(P.roll.t / P.roll.dur) * Math.PI * 2); rigQ.multiply(tQ); }
  }
  if (P.roll) rollDip = Math.sin(Math.PI * clamp(P.roll.t / P.roll.dur, 0, 1)) * 0.75;
  rig.quaternion.copy(rigQ);
  tA.copy(camLocal).applyQuaternion(rigQ);
  rig.position.set(P.pos.x - tA.x, P.pos.y + camLocal.y + P.crouchOff - P.dip - rollDip - tA.y, P.pos.z - tA.z);
  for (const h of hands) { h.root.position.copy(h.local); h.root.quaternion.copy(h.q); }
  rig.updateMatrixWorld(true);
}
function handVisuals() {
  for (const h of hands) {
    h.root.visible = h.has;
    poseHand(h.mesh, h.grabbing ? 1 : h.gripV, h.trigV);
    if (h.grabbing) { tA.copy(h.anchor); h.root.worldToLocal(tA); h.mesh.position.lerp(tA, 0.6); }
    else h.mesh.position.lerp(tB.set(0, 0, 0), 0.4);
  }
}
let hudT = 0, lastHud = '';
function drawHud() {
  const sp = Math.hypot(P.vel.x, P.vel.z) * 3.6, s = `${P.hp | 0}|${sp | 0}|${P.label}|${P.labelT > 0}`;
  if (s === lastHud) return; lastHud = s;
  const g = hudG; g.clearRect(0, 0, 256, 128);
  g.fillStyle = 'rgba(6,4,6,0.82)'; g.fillRect(0, 0, 256, 128); g.fillStyle = '#9e1119'; g.fillRect(0, 0, 256, 5);
  g.font = 'bold 16px Impact, Arial'; g.fillStyle = '#c8141e'; g.fillText('RECKONER', 10, 24);
  g.fillStyle = '#2a0a0c'; g.fillRect(100, 13, 146, 10); g.fillStyle = P.hp > 35 ? '#d11a24' : '#ff3a3a'; g.fillRect(100, 13, 146 * P.hp / 100, 10);
  g.font = 'bold 44px "Segoe UI", Arial'; g.fillStyle = '#fff'; g.fillText(String(sp | 0), 10, 74); g.font = '16px "Segoe UI", Arial'; g.fillStyle = '#999'; g.fillText('KM/H', 10 + g.measureText(String(sp | 0)).width * 2.75 + 6, 74);
  g.fillStyle = '#3a0c10'; g.fillRect(118, 52, 128, 12); g.fillStyle = '#e02a33'; g.fillRect(118, 52, 128 * clamp(sp / 3.6 / VMAX, 0, 1.2) / 1.2, 12);
  g.font = 'bold 22px "Segoe UI", Arial'; g.fillStyle = '#ff4a52'; g.fillText(P.labelT > 0 ? P.label : '', 10, 112);
  hudTex.needsUpdate = true;
  if (desktop) document.getElementById('dhud').textContent = `HP ${P.hp | 0}   SPEED ${sp | 0} km/h   ${P.labelT > 0 ? P.label : ''}\nW sprint (builds momentum) · Space jump (Shift = power) · C crouch/slide/roll · G or right-mouse grab · W while hanging = pull up\nArrows mid-air = flips · F flip mode (${SET.flip}) · R respawn`;
}

/* ---------------- MAIN GAMEPLAY ---------------- */
function gameplay(dt) {
  qYaw.setFromAxisAngle(UP, P.yaw);
  headFwd.set(0, 0, -1).applyQuaternion(headQL); headFwd.y = 0; if (headFwd.lengthSq() < 1e-4) headFwd.set(0, 0, -1); headFwd.normalize().applyQuaternion(qYaw);
  headRight.set(-headFwd.z, 0, headFwd.x);
  runDir.copy(headFwd);
  if (SET.runDir === 'hands' && hands[0].has && hands[1].has && !desktop) {
    tA.set(0, 0, -1).applyQuaternion(hands[0].q).add(tB.set(0, 0, -1).applyQuaternion(hands[1].q)); tA.y = 0;
    if (tA.lengthSq() > 0.05) runDir.copy(tA.normalize().applyQuaternion(qYaw));
  }
  computeSwing(dt);
  if (!desktop && P.calibT > 0) { P.calibT -= dt; if (P.calibT <= 0 && camLocal.y > 1.3) { SET.standH = clamp(camLocal.y, 1.3, 2.1); saveSet(); } }
  // death
  if (P.dead) { P.dead += dt; if (P.dead > 1.0) { respawn(); P.dead = 0; FADE.v = 1; } return; }
  // turning (not mid-air unless hanging/swinging)
  const canTurn = P.onGround || P.grabHand >= 0 || P.swingB;
  P.turnCd -= dt;
  if (canTurn && !desktop) {
    if (SET.turn === 'snap') { if (Math.abs(IN.rx) > 0.72 && P.turnCd <= 0 && Math.abs(IN.rx) > Math.abs(IN.ry)) { P.yaw -= Math.sign(IN.rx) * Math.PI / 6; P.turnCd = 0.28; } if (Math.abs(IN.rx) < 0.3) P.turnCd = Math.min(P.turnCd, 0); }
    else if (Math.abs(IN.rx) > 0.2) P.yaw -= IN.rx * 2.4 * dt;
    if (Math.abs(IN.rx) > 0.72) P.stickArmed = false;
  }
  // menu
  if (IN.yE && P.onGround && Math.hypot(P.vel.x, P.vel.z) < 1.3 && P.grabHand < 0 && !P.swingB && !desktop) { openMenu(); return; }
  if (IN.yE && P.onGround && Math.hypot(P.vel.x, P.vel.z) > 4 && !P.slide) IN.slideE = true;
  // regen
  if (time - P.hurtT > 4 && P.hp < 100) P.hp = Math.min(100, P.hp + 9 * dt);
  updateGrabs(dt);
  // roomscale delta (world)
  const dW = tD.set(camLocal.x - prevCam.x, 0, camLocal.z - prevCam.z).applyQuaternion(qYaw);
  if (dW.lengthSq() > 0.25) dW.set(0, 0, 0);
  if (P.anim) animUpdate(dt);
  else if (P.grabHand >= 0) climbUpdate(dt);
  else if (P.swingB) swingUpdate(dt);
  else normalUpdate(dt, dW);
  // crouch offset (slide via button / forced crouch under obstacles)
  if (!P.anim && P.grabHand < 0) {
    let target = 0;
    if (P.slide && P.slide.btn) target = Math.min(0, 0.85 - camLocal.y);
    const maxHe = ceilingClear() - 0.14; if (camLocal.y + target > maxHe) target = maxHe - camLocal.y;
    P.crouchOff = approach(P.crouchOff, target, dt * (target < P.crouchOff ? 7 : 2.6));
  }
  // flip / roll progress
  if (P.flip) { P.flip.t += dt; if (P.flip.t >= P.flip.dur) P.flip = null; }
  if (P.roll) { P.roll.t += dt; if (P.roll.t >= P.roll.dur) P.roll = null; }
  // view dip spring
  P.dipV += (-70 * P.dip - 13 * P.dipV) * dt; P.dip = clamp(P.dip + P.dipV * dt, -0.1, 0.4);
  // checkpoints
  if (P.onGround && !P.slide && P.pos.y > 4) {
    P.safeT += dt;
    if (P.safeT > 0.5) { const b = groundBelow(P.pos.x, P.pos.z, P.pos.y + 0.01); if (b && b.x1 - b.x0 > 3 && b.z1 - b.z0 > 3 && Math.min(P.pos.x - b.x0, b.x1 - P.pos.x, P.pos.z - b.z0, b.z1 - P.pos.z) > 1.0) P.safe.copy(P.pos); P.safeT = 0; }
  } else P.safeT = 0;
  if (P.pos.y < -4) die();
  // summit
  if (!P.summit && P.onGround && P.pos.y > SUMMIT_Y - 0.2) { P.summit = true; setLabel('SUMMIT', 4); SFX.summit(); say('The whole city, under my feet. Somewhere down there… the man who killed them.', 6); }
  P.labelT -= dt;
}

/* ---------------- FADE / OVERLAY ---------------- */
const FADE = { v: 1 };
let heartT = 0;
function overlayUpdate(dt) {
  const sp = Math.hypot(P.vel.x, P.vel.z);
  let vig = 0;
  if (SET.vignette) { if (!P.onGround || sp > 6.5) vig = clamp((sp - 6) / 7, 0, 0.42); if (P.swingB) vig = Math.max(vig, 0.3); }
  if (SET.flip === 'comfort') { if (P.flip) vig = Math.max(vig, Math.sin(Math.PI * clamp(P.flip.t / P.flip.dur, 0, 1)) * 0.95); if (P.roll) vig = Math.max(vig, Math.sin(Math.PI * clamp(P.roll.t / P.roll.dur, 0, 1)) * 0.8); }
  ovMat.uniforms.uVig.value = lerp(ovMat.uniforms.uVig.value, vig, Math.min(1, dt * 8));
  P.redFlash = Math.max(0, P.redFlash - dt * 0.9);
  const low = P.hp < 40 ? (40 - P.hp) / 40 * 0.7 : 0;
  ovMat.uniforms.uRed.value = Math.max(P.redFlash, low);
  if (P.dead) FADE.v = Math.min(1, P.dead * 2.2); else FADE.v = Math.max(0, FADE.v - dt * 1.2);
  ovMat.uniforms.uFade.value = FADE.v;
  if (P.hp < 35 && !P.dead) { heartT -= dt; if (heartT <= 0) { SFX.heart(); heartT = 0.85; } }
  // subtitles
  if (SUB.cur) { SUB.cur.t += dt; const k = SUB.cur.t, d = SUB.cur.dur; subMesh.material.opacity = Math.min(1, k * 3, (d - k) * 2); if (k > d) { SUB.cur = null; subMesh.material.opacity = 0; } }
  else if (SUB.queue.length) { SUB.queue[0].at -= dt; if (SUB.queue[0].at <= 0) { SUB.cur = SUB.queue.shift(); SUB.cur.t = 0; drawSub(SUB.cur.text); } }
}

/* ---------------- LOOP ---------------- */
const clock = new THREE.Clock();
function loop(t, frame) {
  const dt = Math.min(clock.getDelta(), 0.05); time += dt;
  if (!started) { renderer.render(scene, camera); return; }
  if (renderer.xr.isPresenting) { renderer.xr.updateCamera(camera); readXR(frame, dt); } else readDesktop(dt);
  if (!camInit) { prevCam.copy(camLocal); velCam.copy(camLocal); for (const h of hands) h.prev.copy(h.local); camInit = true; }
  headVel.copy(camLocal).sub(velCam).divideScalar(Math.max(dt, 1e-3)); velCam.copy(camLocal);
  for (const h of hands) { h.vel.copy(h.local).sub(h.prev).divideScalar(Math.max(dt, 1e-3)); h.prev.copy(h.local); }
  if (MENU.open) menuUpdate(); else gameplay(dt);
  prevCam.copy(camLocal);
  updateRig();
  handVisuals();
  weatherUpdate(dt);
  overlayUpdate(dt);
  // audio
  if (AU.ctx) {
    const sp = P.vel.length(), air = !P.onGround && P.grabHand < 0;
    AU.windG.gain.value = lerp(AU.windG.gain.value, clamp((sp - 3) / 10, 0, 0.55) * (air ? 1.2 : 0.7), Math.min(1, dt * 5));
    AU.windF.frequency.value = 280 + sp * 55;
    AU.slideG.gain.value = lerp(AU.slideG.gain.value, P.slide && P.onGround ? 0.25 : 0, Math.min(1, dt * 12));
  }
  // rain / sky follow
  const cw = tA.copy(camLocal).applyMatrix4(rig.matrixWorld);
  rainMat.uniforms.uCam.value.copy(cw); sky.position.copy(cw);
  // shadow blob
  const gb = groundBelow(P.pos.x, P.pos.z, P.pos.y + 0.05);
  if (gb) { const hgt = P.pos.y - gb.y1; blob.visible = hgt < 40; blob.position.set(P.pos.x, gb.y1 + 0.03, P.pos.z); const s = 0.7 + hgt * 0.03; blob.scale.set(s, s, 1); blob.material.opacity = clamp(0.85 - hgt * 0.025, 0.2, 0.85); } else blob.visible = false;
  hudT -= dt; if (hudT <= 0) { drawHud(); hudT = 0.08; }
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(loop);

/* ---------------- START ---------------- */
const ui = document.getElementById('ui'), vrBtn = document.getElementById('vrBtn'), deskBtn = document.getElementById('deskBtn'), st = document.getElementById('st');
function beginGame() {
  started = true; camInit = false; ui.style.display = 'none';
  P.pos.copy(SPAWN); P.vel.set(0, 0, 0); P.yaw = -Math.PI / 2; FADE.v = 1; P.hp = 100; P.calibT = 1.5;
  SUB.queue.length = 0; SUB.cur = null;
  say('Blackwater. It never stops raining here.', 3.6, 1.0);
  say('Every night, someone bleeds. Every night… I hunt.', 3.8, 0.5);
  say('First, I own these rooftops.', 3.2, 0.5);
  setLabel('CATHEDRAL QUARTER', 4);
}
deskBtn.disabled = false; deskBtn.textContent = 'PLAY ON DESKTOP (TEST)';
deskBtn.onclick = () => { initAudio(); desktop = true; document.getElementById('dhud').style.display = 'block'; document.getElementById('cross').style.display = 'block'; beginGame(); renderer.domElement.requestPointerLock(); };
if (navigator.xr) {
  navigator.xr.isSessionSupported('immersive-vr').then(ok => {
    vrBtn.disabled = !ok; vrBtn.textContent = ok ? 'ENTER VR' : 'VR NOT AVAILABLE HERE';
    if (!ok) st.textContent = 'Open this page in the Meta Quest Browser to play in VR. Desktop test mode works here.';
  }).catch(() => { vrBtn.textContent = 'VR NOT AVAILABLE HERE'; });
} else { vrBtn.textContent = 'VR NOT AVAILABLE HERE'; st.textContent = 'Open this page in the Meta Quest Browser to play in VR. Desktop test mode works here.'; }
vrBtn.onclick = async () => {
  initAudio();
  try {
    const session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor'] });
    renderer.xr.setFoveation(0.7);
    await renderer.xr.setSession(session);
    desktop = false; beginGame();
    session.addEventListener('end', () => { started = false; ui.style.display = 'flex'; closeMenu(); });
  } catch (e) { st.textContent = 'Could not start VR: ' + e.message; }
};
